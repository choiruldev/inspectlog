<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Inner Circuit / Radar Grid -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,8"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#334155" stroke-width="2"/>
  
  <!-- Sleek Pulse & Terminal Angle Marks -->
  <g filter="url(#glow)">
    <!-- Terminal Inspect Chevron -->
    <path d="M176 192 L240 256 L176 320" fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Radar Probe Pulse Line -->
    <path d="M260 320 L336 320" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Live Anomaly Indicator Dot -->
    <circle cx="336" cy="208" r="22" fill="#10b981"/>
    <circle cx="336" cy="208" r="34" fill="none" stroke="#10b981" stroke-width="4" opacity="0.6"/>
  </g>
</svg>